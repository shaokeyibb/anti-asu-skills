name: validate-skills

on:
  push:
    paths: ['skills/**', 'evals/**', 'scripts/**', '.claude-plugin/**', '.github/workflows/**']
  pull_request:
    paths: ['skills/**', 'evals/**', 'scripts/**', '.claude-plugin/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skills
        run: python3 scripts/validate_skills.py
